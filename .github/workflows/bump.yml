name: Bump polymarket-tui

# Keeps Formula/polymarket-tui.rb in sync with the latest PyPI release.
# Tokenless: the tap's own GITHUB_TOKEN commits the bump - no cross-repo
# credential needed. Runs daily, on manual dispatch, and on a
# repository_dispatch (type: pypi-release) if the app repo ever sends one
# for instant bumps.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [pypi-release]

permissions:
  contents: write
  actions: write   # keepalive re-enables this workflow via the API

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bot commits do not count as repo activity, so GitHub disabled this cron
      # after 60 days (2026-09-05, found 2026-09-14). Re-enabling the workflow
      # through the API on every run resets that timer without touching the git
      # history. Done with gh rather than a marketplace action: this account's
      # Actions policy blocks third-party actions ("Repository access blocked").
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bump.yml/enable"
      - name: Bump formula from PyPI
        id: bump
        run: python3 scripts/bump.py Formula/polymarket-tui.rb polymarket-tui
      - name: Commit if changed
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/polymarket-tui.rb
          git commit -m "polymarket-tui: bump to ${{ steps.bump.outputs.version }}"
          git push
